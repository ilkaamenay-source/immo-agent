name: immo-agent
on:
  schedule:
    - cron: "17 */3 * * *"     # toutes les 3 h (UTC) ; modifie à ta guise
  workflow_dispatch:           # bouton "Run workflow" pour tester à la main
  push:
    paths: ["manual_urls.txt"]  # se relance dès que tu modifies cette liste

permissions:
  contents: write              # pour sauvegarder state/seen.json

concurrency:
  group: immo-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"      # affiche le log en direct (sinon il n'apparaît qu'à la fin)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer l'agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.main
      - name: Sauvegarder l'état (annonces déjà vues, cache quartiers)
        run: |
          git config user.name "immo-agent"
          git config user.email "immo-agent@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "state: mise à jour" && git push)
