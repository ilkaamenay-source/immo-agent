# ============================================================================
#  PROJETS DE TRANSPORT FUTURS  -  utilisé pour la "note transport futur"
#  Calendriers vérifiés le 25/10/2026 (sources en commentaire). Ils bougent souvent :
#  relis ce fichier tous les 3 mois et corrige les dates.
#
#  status (fiabilité du projet) :
#    date_officielle  mise en service datée officiellement et travaux terminés ou presque  (poids 1.0)
#    en_travaux       chantier en cours, date annoncée mais pouvant glisser                (poids 0.85)
#    finance          décidé/financé mais chantier pas vraiment avancé                     (poids 0.6)
#    etude            à l'étude, non financé ou date incertaine                            (poids 0.3)
#  kind d'une gare :
#    new      nouvelle gare/station (nouvel accès au réseau)          -> bonus max +3.0
#    upgrade  gare existante qui gagne une ligne ou une meilleure desserte -> bonus max +2.0
#  lat/lon : facultatif. Sans coordonnées, l'agent retrouve la gare via OpenStreetMap ; si elle n'y est
#  pas, il signale seulement que le projet touche la commune (sans l'inclure dans la note).
#  Pour ajouter une gare : copie une ligne "- {name: ...}" et renseigne communes.
# ============================================================================
