# ============================================================
#  CONFIG DE L'AGENT IMMO  -  tout se règle ici
# ============================================================

mode: rent            # "rent" (location) ou "buy" (achat)

mail:
  imap_host: imap.gmail.com
  folder: alertes-immo        # ou le nom d'un libellé Gmail (ex: "alertes-immo")
  days_back: 3         # on relit les mails des N derniers jours (les doublons sont ignorés)
  sender_contains:     # on ne lit que les mails dont l'expéditeur contient un de ces mots
    - seloger
    - bienici
    - pap.fr
    - leboncoin
    - logic-immo
    - jinka

# Sites reconnus. "url_regex" = motif d'une VRAIE page d'annonce (à ajuster
# après avoir regardé tes emails réels, voir README).
sources:
  seloger:    {hosts: [seloger.com],    url_regex: "/annonces/|/detail"}
  bienici:    {hosts: [bienici.com],    url_regex: "/annonce/"}
  pap:        {hosts: [pap.fr],         url_regex: "/annonces/"}
  leboncoin:  {hosts: [leboncoin.fr],   url_regex: "/ad/"}
  logicimmo:  {hosts: [logic-immo.com], url_regex: "/detail"}

# ---------------- FILTRES (mets null pour désactiver) ----------------
filters:
  price_min: null
  price_max: 850             # loyer (ou prix d'achat en mode buy)
  total_max: null             # loyer + charges
  charges_max: null
  surface_min: 35
  surface_max: null
  rooms_min: 2
  rooms_max: null
  price_per_m2_max: null
  floor_min: null             # étage minimum (0 = rez-de-chaussée)
  exclude_ground_floor: true  # rejette le rez-de-chaussée
  elevator_required_from_floor: 4   # si étage >= 4, ascenseur obligatoire
  dpe_allowed: [A, B, C, D, E]      # null pour désactiver
  furnished: false             # true = meublé seulement, false = non meublé, null = peu importe
  zipcodes_allowed: ["78","95","92"]        # ex: ["75011", "75020"]  ([] = tous)
  cities_allowed: []          # ex: ["Paris", "Montreuil"]
  exclude_keywords:
    - rez-de-chaussee
    - rdc
    - colocation
    - viager
    - nue-propriete
    - sous-sol
    - bruyant
  require_any_keywords: ["parking"]    # ex: ["balcon", "terrasse"]  ([] = aucun)
  on_missing: keep            # info absente de l'annonce : "keep" (garder) ou "reject"

# ---------------- NOTE DU QUARTIER ----------------
scoring:
  weights:                    # total libre, c'est renormalisé automatiquement
    transport: 4
    calme: 3
    commerces: 2
    prix: 1                   # utilisé seulement en mode "buy" (comparaison DVF)
  min_score_to_notify: null   # ex: 6 -> n'envoie que les annonces notées >= 6/10
  walking_speed_m_per_min: 75

limits:
  max_new_per_run: 25         # protège ton quota Gemini / la durée du job
  radius_m: 600               # rayon d'analyse autour de l'annonce

gemini:
  model: gemini-2.5-flash
  use_for_extraction: true    # lit les pages d'annonces inconnues
  use_for_neighborhood: true  # rédige le résumé du quartier (mis en cache)
